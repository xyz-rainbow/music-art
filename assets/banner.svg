<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0714" />
      <stop offset="50%" stop-color="#140f2b" />
      <stop offset="100%" stop-color="#05030a" />
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="80%" stop-color="#ff007f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGradient)" />

  <!-- Subtle Waveform Grid Background -->
  <g opacity="0.12" stroke="#7928ca" stroke-width="1.5">
    <path d="M 50 320 Q 200 240 350 320 T 650 320 T 950 320 T 1150 320" fill="none" />
    <path d="M 50 340 Q 200 280 350 340 T 650 340 T 950 340 T 1150 340" fill="none" />
    <path d="M 50 300 Q 200 200 350 300 T 650 300 T 950 300 T 1150 300" fill="none" />
  </g>

  <!-- Left Side Logo Emblem -->
  <g transform="translate(140, 200)">
    <!-- Vinyl Disc -->
    <circle cx="0" cy="0" r="110" fill="#120c24" stroke="#332454" stroke-width="3" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#251a42" stroke-width="2" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#2a1f4a" stroke-width="1.5" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#251a42" stroke-width="2" />
    
    <!-- Vinyl Center Label -->
    <circle cx="0" cy="0" r="48" fill="#1e1338" stroke="url(#titleGradient)" stroke-width="2.5" />
    
    <!-- Neon Note Glow -->
    <g filter="url(#glow)">
      <circle cx="-14" cy="16" r="11" fill="#00f0ff" />
      <circle cx="18" cy="6" r="11" fill="#ff007f" />
      <path d="M -3 16 L -3 -24 L 29 -32 L 29 6" fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M -3 -24 L 29 -32 L 29 -22 L -3 -14 Z" fill="#ff007f" />
    </g>
    <circle cx="0" cy="0" r="7" fill="#05030a" stroke="#d946ef" stroke-width="1.5" />
  </g>

  <!-- Title and Text Content -->
  <g transform="translate(320, 150)">
    <!-- Main Title -->
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="64" font-weight="900" letter-spacing="4" fill="url(#titleGradient)" filter="url(#glow)">MUSIC-ART</text>

    <!-- Accent Divider -->
    <rect x="0" y="62" width="680" height="3" fill="url(#accentLine)" rx="1.5" />

    <!-- Subtitle -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="22" font-weight="600" letter-spacing="1.5" fill="#e2e8f0">
      AI Audio Optimization &amp; 1:1 Album Artwork Pipeline
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 130)">
      <!-- Badge 1: Dynamic Bitrate -->
      <rect x="0" y="0" width="170" height="32" rx="16" fill="#1e163b" stroke="#00f0ff" stroke-width="1" />
      <text x="85" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#00f0ff" text-anchor="middle">DYNAMIC BITRATE</text>

      <!-- Badge 2: AI 1:1 Covers -->
      <rect x="185" y="0" width="165" height="32" rx="16" fill="#1e163b" stroke="#d946ef" stroke-width="1" />
      <text x="267" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#d946ef" text-anchor="middle">1:1 AI ARTWORK</text>

      <!-- Badge 3: Lossless Tag & Embed -->
      <rect x="365" y="0" width="175" height="32" rx="16" fill="#1e163b" stroke="#ff007f" stroke-width="1" />
      <text x="452" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#ff007f" text-anchor="middle">LOSSLESS EMBEDDING</text>

      <!-- Badge 4: Universal Agent -->
      <rect x="555" y="0" width="155" height="32" rx="16" fill="#1e163b" stroke="#10b981" stroke-width="1" />
      <text x="632" y="21" font-family="monospace" font-size="12" font-weight="bold" fill="#10b981" text-anchor="middle">MULTI-AGENT CLI</text>
    </g>
  </g>
</svg>
