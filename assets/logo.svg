<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18112b" />
      <stop offset="70%" stop-color="#0a0814" />
      <stop offset="100%" stop-color="#040308" />
    </radialGradient>

    <!-- Vinyl Grooves Gradient -->
    <linearGradient id="vinylGrooves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2046" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0e0a1e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a2046" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Holographic Specular Shine -->
    <linearGradient id="holoShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.7"/>
      <stop offset="25%" stop-color="#7928ca" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#ffb800" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Outer Vinyl Rim -->
  <circle cx="256" cy="256" r="200" fill="url(#vinylGrooves)" stroke="#3a2f60" stroke-width="3" opacity="0.9" />

  <!-- Microgrooves -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#251b40" stroke-width="2" opacity="0.7" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="#2a2046" stroke-width="1.5" opacity="0.6" />
  <circle cx="256" cy="256" r="152" fill="none" stroke="#251b40" stroke-width="2" opacity="0.7" />
  <circle cx="256" cy="256" r="136" fill="none" stroke="#2a2046" stroke-width="1.5" opacity="0.6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#251b40" stroke-width="2" opacity="0.7" />

  <!-- Holographic Sheen Cones -->
  <path d="M 256 256 L 115 115 A 200 200 0 0 1 397 115 Z" fill="url(#holoShine)" opacity="0.18" />
  <path d="M 256 256 L 397 397 A 200 200 0 0 1 115 397 Z" fill="url(#holoShine)" opacity="0.18" />

  <!-- Inner Center Label Background -->
  <circle cx="256" cy="256" r="92" fill="#0d091a" stroke="url(#holoShine)" stroke-width="3" />
  <circle cx="256" cy="256" r="82" fill="url(#centerGlow)" opacity="0.35" />

  <!-- Glowing Sonic Waveform / Eighth Note Hybrid Symbol -->
  <g filter="url(#neonGlow)">
    <!-- Wave Bars Around Center -->
    <line x1="210" y1="256" x2="210" y2="236" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
    <line x1="222" y1="256" x2="222" y2="220" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" />
    <line x1="234" y1="256" x2="234" y2="204" stroke="#7928ca" stroke-width="5" stroke-linecap="round" />
    
    <!-- Central Note Stem & Beam -->
    <path d="M 250 290 C 250 304 238 316 224 316 C 210 316 198 304 198 290 C 198 276 210 264 224 264 C 232 264 240 268 245 274 L 245 190 L 305 174 L 305 272" 
          fill="none" stroke="#00f0ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Musical Note Heads -->
    <ellipse cx="224" cy="290" rx="18" ry="14" transform="rotate(-15 224 290)" fill="#00f0ff" />
    <ellipse cx="284" cy="272" rx="18" ry="14" transform="rotate(-15 284 272)" fill="#ff007f" />
    
    <!-- Flag / Wave Connector -->
    <path d="M 245 190 Q 275 180 305 174 L 305 192 Q 275 198 245 208 Z" fill="#ff007f" opacity="0.9" />

    <!-- Right Wave Bars -->
    <line x1="278" y1="240" x2="278" y2="220" stroke="#ff007f" stroke-width="5" stroke-linecap="round" />
    <line x1="290" y1="244" x2="290" y2="230" stroke="#ff007f" stroke-width="5" stroke-linecap="round" />
    <line x1="302" y1="256" x2="302" y2="242" stroke="#ffb800" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Spindle Hole -->
  <circle cx="256" cy="256" r="12" fill="#040308" stroke="#7928ca" stroke-width="2" />
  <circle cx="256" cy="256" r="4" fill="#00f0ff" />

  <!-- Outer Orbit Particle Sparks -->
  <circle cx="120" cy="190" r="3" fill="#00f0ff" opacity="0.8" filter="url(#neonGlow)" />
  <circle cx="390" cy="180" r="2.5" fill="#ff007f" opacity="0.8" filter="url(#neonGlow)" />
  <circle cx="360" cy="360" r="3.5" fill="#ffb800" opacity="0.7" filter="url(#neonGlow)" />
  <circle cx="150" cy="350" r="2" fill="#7928ca" opacity="0.8" filter="url(#neonGlow)" />
</svg>
